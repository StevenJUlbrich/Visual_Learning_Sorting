let allSteps=[];
function buildSteps(){
allSteps=[];
allSteps.push({type:'cmd',text:'<span class="b">$</span> <span class="w">uv run pytest</span>'});
allSteps.push({type:'blank'});
allSteps.push({type:'line',text:'<span class="m">============================</span> <span class="w">test session starts</span> <span class="m">============================</span>'});
allSteps.push({type:'line',text:'<span class="d">platform linux -- Python 3.13.3, pytest-8.3.5, pluggy-1.5.0</span>'});
allSteps.push({type:'line',text:'<span class="d">rootdir: /home/steven/Visual_Learning_Sorting</span>'});
allSteps.push({type:'line',text:'<span class="d">configfile: pyproject.toml</span>'});
allSteps.push({type:'line',text:'<span class="d">plugins: anyio-4.9.0</span>'});
allSteps.push({type:'line',text:'<span class="w">collected <span class="b">339 items</span></span>'});
allSteps.push({type:'blank'});
let passed=0;
for(const f of files){
let dots='';
for(let i=0;i<f.tests.length;i++){
passed++;
dots+='<span class="g">.</span>';
}
let pct=Math.round(passed/339*100);
let pctStr=String(pct).padStart(3,' ');
allSteps.push({type:'file',text:'<span class="w">'+f.path+'</span> '+dots+' <span class="d">['+pctStr+'%]</span>',count:f.tests.length});
}
allSteps.push({type:'blank'});
let elapsed=(4.2+Math.random()*0.8).toFixed(2);
allSteps.push({type:'line',text:'<span class="g">============================ 339 passed in '+elapsed+'s ============================</span>'});
allSteps.push({type:'blank'});
allSteps.push({type:'cmd',text:'<span class="b">$</span> <span class="w">uv run ruff check src/ tests/</span>'});
allSteps.push({type:'pause',ms:600});
allSteps.push({type:'line',text:'<span class="g">All checks passed!</span>'});
allSteps.push({type:'blank'});
allSteps.push({type:'cmd',text:'<span class="b">$</span> <span class="w">uv run ruff format --check src/ tests/</span>'});
allSteps.push({type:'pause',ms:400});
allSteps.push({type:'line',text:'<span class="d">38 files already formatted</span>'});
}
buildSteps();

let stepIdx=0;
function getDelay(){
return 90/parseInt(speedSlider.value);
}

function addLine(html){
term.innerHTML+=html+'\n';
term.scrollTop=term.scrollHeight;
}

function runNext(){
if(stepIdx>=allSteps.length){
btnStart.style.display='none';
btnReset.style.display='inline-block';
running=false;
return;
}
let s=allSteps[stepIdx++];
if(s.type==='blank'){addLine('');timer=setTimeout(runNext,getDelay()*0.5);}
else if(s.type==='cmd'){addLine(s.text);timer=setTimeout(runNext,getDelay()*8);}
else if(s.type==='file'){addLine(s.text);timer=setTimeout(runNext,getDelay()*Math.max(2,s.count*0.5));}
else if(s.type==='pause'){timer=setTimeout(runNext,s.ms/parseInt(speedSlider.value));}
else{addLine(s.text);timer=setTimeout(runNext,getDelay());}
}

btnStart.addEventListener('click',()=>{
if(running)return;
running=true;
btnStart.disabled=true;
term.innerHTML='';
stepIdx=0;
buildSteps();
runNext();
});
btnReset.addEventListener('click',()=>{
if(timer)clearTimeout(timer);
running=false;
stepIdx=0;
term.innerHTML='';
btnStart.style.display='inline-block';
btnStart.disabled=false;
btnReset.style.display='none';
});
</script>
